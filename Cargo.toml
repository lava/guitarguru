[package]
name = "guitarguru"
version = "0.1.0"
edition = "2024"
description = "Rhythm guitar practice: a tempo ladder, timing and tone feedback, and riff loops from practice packs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lava/guitarguru"

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["2d", "ui", "png"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cpal = { version = "0.18.2", features = ["pulseaudio"] }
directories = "6.0.0"
flate2 = "1.1.10"
hound = "3.5.1"
nam-rs = "0.4.0"
realfft = "3.5.1"
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
debug = 1

[dev-dependencies]
resvg = "0.49.0"
